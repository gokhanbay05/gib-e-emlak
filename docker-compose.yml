services:
  postgres:
    image: postgres:16-alpine
    container_name: gib_emlak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gib_user
      POSTGRES_PASSWORD: gib_password
      POSTGRES_DB: gib_emlak_db
    ports:
      - "5432:5432"
    volumes:
      - gib_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gib_user -d gib_emlak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gib_emlak_pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gibemlak.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gib_emlak_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://gib_user:gib_password@postgres:5432/gib_emlak_db
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gib_emlak_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  gib_postgres_data:
